name: Temporary Expo lockfile resolution
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: expo-lock-resolver-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve-lock:
    name: Resolve Expo SDK lock delta (no writes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Resolve exact Expo peer-compatible lockfile
        working-directory: mobile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            'expo@~58.0.21' 'expo-constants@~58.0.14' \
            'expo-image@~58.0.18' 'expo-linking@~58.0.15' \
            'expo-router@~58.0.28' 'react-native@0.88.1'
      - name: Print only changed dependency metadata for review
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const before=JSON.parse(cp.execFileSync('git',['show','HEAD:mobile/package-lock.json'],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const keys=new Set([...Object.keys(before.packages),...Object.keys(after.packages)]);
          const changed={},removed=[];
          for(const k of keys) {
            if(JSON.stringify(before.packages[k])!==JSON.stringify(after.packages[k])){
              if(after.packages[k]) changed[k]=after.packages[k];else removed.push(k);
            }
          }
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          console.log('LOCK_DELTA_START');
          console.log(JSON.stringify({dependencies:p.dependencies,changed,removed}));
          console.log('LOCK_DELTA_END');
          console.log('CHANGED_PACKAGE_COUNT',Object.keys(changed).length);
          NODE

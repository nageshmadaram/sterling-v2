name: Preproduction Snapback isolated E2E
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapback-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Reproduce isolated E2E and datetime schema restart
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
          DEFAULT_UNDERLYING: NIFTY
          LOG_LEVEL: WARNING
          PYTHONWARNINGS: ignore
        run: |
          python -m pytest -vv -s -p no:randomly --tb=short \
            tests/e2e_live/test_sim_e2e.py::test_a_snapback_entry_on_the_sim_tenant_fills_virtually_with_its_hedge_and_is_stopped_out \
            tests/e2e_live/test_snapback_freezegun_schema.py::test_snapback_repeated_fresh_import_preserves_pydantic_datetime_contract

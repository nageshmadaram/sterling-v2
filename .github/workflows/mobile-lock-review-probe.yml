name: Mobile dependency lock review diagnostic (non-release)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recompute only the three SDK-compatible patch dependencies
        run: |
          cd mobile
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 'expo@~58.0.22' 'expo-router@~58.0.29' 'react-native-screens@~4.30.1'
          cd ..
          git diff --check
          echo 'LOCKFILE_DIFF_START'
          git diff -- mobile/package.json mobile/package-lock.json
          echo 'LOCKFILE_DIFF_END'
      - name: Warning
        run: echo 'Diagnostic only. No release, branch push or broker authority.'

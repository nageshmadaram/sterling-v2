name: Phase 3 Market Data Reliability Validation

on:
  push:
    branches:
      - upgrade/market-data-reliability-20261029
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Phase 3 / Read-only Market Data and Safety Regression
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Sterling dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Compile read-only reliability modules
        run: |
          python -m compileall -q backend/app/schemas/market_reliability.py \
            backend/app/services/market_data/reliability.py \
            backend/app/services/market_data/historical_reliability.py
      - name: Phase 3 targeted and earlier safety contract tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
        run: |
          python -m pytest -q --tb=short \
            tests/test_market_data_reliability.py \
            tests/test_market_data_history_reliability.py \
            tests/test_broker_normalized_read.py \
            tests/test_broker_read_contract_edges.py \
            tests/test_broker_kite_provider_boundary.py \
            tests/test_broker_access_policy.py \
            tests/test_broker_registry.py \
            tests/test_registry_signed_auth_contract.py \
            tests/test_platform_strategy_registry.py \
            tests/test_platform_strategy_registry_safety.py
      - name: No new unreviewed direct broker access
        run: python backend/scripts/audit_broker_access.py
      - name: Enforce Phase 3 module has no order authority or API routes
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          roots = [Path("backend/app/services/market_data/reliability.py"),
                   Path("backend/app/services/market_data/historical_reliability.py")]
          forbidden = {"place_order", "modify_order", "cancel_order",
                       "submit_order", "flatten", "market_reduce_close",
                       "place_gtt", "modify_gtt", "delete_gtt"}
          for p in roots:
              tree = ast.parse(p.read_text())
              methods = {node.name for node in ast.walk(tree)
                         if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
              assert not (methods & forbidden), (p, methods & forbidden)
              assert not any(isinstance(n, ast.ImportFrom) and
                             n.module and n.module.startswith("fastapi")
                             for n in ast.walk(tree))
          print("PASS: Phase 3 modules have no order-writing or FastAPI routes")
          PY

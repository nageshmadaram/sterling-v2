name: Phase 5 Offline Scheduler and Backlog Certification

on:
  push:
    branches:
      - upgrade/offline-scheduler-backlog-20261029
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-orchestration:
    name: Phase 5 / Scheduler, Backlog, Risk Gate Regression
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sterling locked backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Compile new offline-only scheduler and migration
        run: |
          python -m compileall -q backend/app/domain/offline_scheduler.py \
            backend/app/persistence/offline_scheduler_service.py \
            backend/app/persistence/offline_scheduler_models.py \
            backend/alembic/versions/c75f92d1a341_offline_orchestration.py
      - name: Test Phase 5, Phase 4, registry, broker and market data safety
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
        run: |
          python -m pytest -q --tb=short \
            tests/test_offline_scheduler_phase5.py \
            tests/test_execution_validation_gate.py \
            tests/test_market_data_reliability.py \
            tests/test_market_data_history_reliability.py \
            tests/test_broker_normalized_read.py \
            tests/test_broker_read_contract_edges.py \
            tests/test_broker_kite_provider_boundary.py \
            tests/test_broker_access_policy.py \
            tests/test_broker_registry.py \
            tests/test_registry_signed_auth_contract.py \
            tests/test_platform_strategy_registry.py \
            tests/test_platform_strategy_registry_safety.py
      - name: No newly introduced unreviewed direct broker access
        run: python backend/scripts/audit_broker_access.py
      - name: Forbid route, network, timer and broker write authority
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          paths = [Path('backend/app/domain/offline_scheduler.py'),
                   Path('backend/app/persistence/offline_scheduler_service.py')]
          forbidden_methods = {'place_order','cancel_order','modify_order',
                               'submit_order','send_order','market_reduce_close',
                               'place_gtt','modify_gtt','delete_gtt','APIRouter',
                               'create_task','call_later','schedule_interval'}
          for p in paths:
              tree = ast.parse(p.read_text())
              functions = {n.name for n in ast.walk(tree)
                           if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
              assert not (functions & forbidden_methods), (p,functions & forbidden_methods)
              blocked_imports=('fastapi','httpx','requests','kiteconnect',
                               'app.services.exchanges.kite','app.services.execution.order_router')
              for n in ast.walk(tree):
                  if isinstance(n,ast.ImportFrom):
                      assert not any((n.module or '').startswith(prefix)
                                     for prefix in blocked_imports), (p,n.module)
                  if isinstance(n,ast.Import):
                      assert not any(a.name.startswith(prefix) for a in n.names
                                     for prefix in blocked_imports), p
          print('PASS: scheduler has no broker, HTTP routes, external network or worker')
          PY

  postgres-orchestration:
    name: Phase 5 / PostgreSQL16 Immutable Audit and Isolated Restore
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sterling_queue_ci
          POSTGRES_USER: sterling_ci
          POSTGRES_PASSWORD: synthetic_ci_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sterling_ci -d sterling_queue_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://sterling_ci:synthetic_ci_secret@localhost:5432/sterling_queue_ci
      STERLING_SCHEDULE_DISPOSABLE_DB: 'yes'
      ENVIRONMENT: test
      PAPER_TRADING: 'true'
      REAL_PUBLIC_DATA: 'false'
      PGHOST: localhost
      PGUSER: sterling_ci
      PGPASSWORD: synthetic_ci_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and PostgreSQL driver
        run: |
          python -m pip install -r backend/requirements.lock.txt
          python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Migrate and validate durable queue ledger
        working-directory: backend
        run: PYTHONPATH=. python scripts/validate_orchestration_postgres.py
      - name: Dump/restore isolated DB using matching PostgreSQL16 clients
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v /tmp:/tmp \
            -e PGPASSWORD="$PGPASSWORD" postgres:16 \
            pg_dump -h localhost -U "$PGUSER" -Fc --no-owner -d sterling_queue_ci -f /tmp/sterling_queue_ci.dump
          psql -d sterling_queue_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE sterling_queue_restore_ci;'
          docker run --rm --network host --user "$(id -u):$(id -g)" -v /tmp:/tmp \
            -e PGPASSWORD="$PGPASSWORD" postgres:16 \
            pg_restore -h localhost -U "$PGUSER" --no-owner --exit-on-error \
            -d sterling_queue_restore_ci /tmp/sterling_queue_ci.dump
          psql -d sterling_queue_restore_ci -At \
            -c "SELECT count(*) FROM platform_orchestration_events" | grep -qx '3'
      - name: Rehearse destructive downgrade only in disposable CI DB
        working-directory: backend
        run: |
          python -m alembic downgrade b64f3c27e190
          python -m alembic upgrade head

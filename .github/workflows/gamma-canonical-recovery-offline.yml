name: Gamma Canonical Recovery (offline review)

on:
  pull_request:
    paths:
      - '.github/workflows/gamma-canonical-recovery-offline.yml'
      - 'backend/tests/services/test_gamma_recovery.py'
      - 'backend/tests/services/test_gamma_fired_child.py'
      - 'backend/tests/services/test_gamma_move_live_audit.py'
      - 'backend/tests/services/test_gamma_move_production.py'
      - 'backend/tests/services/test_canonical_fill_reconciliation.py'
      - 'backend/tests/unit/test_canonical_strategy_reduction.py'
      - 'backend/tests/engines/sterling_kite_engine/test_production_audit.py'
      - 'backend/app/services/exchanges/kite/login_preflight.py'
      - 'backend/tests/test_kite_login_preflight.py'
      - 'backend/tests/test_kite_mobile_login.py'
      - 'backend/tests/e2e_live/machine.py'
      - 'backend/tests/e2e_live/test_admission_dry_run.py'
      - 'backend/tests/e2e_live/test_sim_e2e.py'
      - 'backend/tests/e2e_live/test_trade_journal_e2e.py'
      - 'backend/tests/unit/test_canonical_execution_convergence.py'
      - 'backend/tests/unit/test_canonical_fresh_reduction_proof.py'
      - 'backend/tests/unit/test_gamma_tranche_readiness.py'
      - 'backend/app/services/gamma_tranche_readiness.py'
      - 'backend/app/services/gamma_tranche_review_claims.py'
      - 'backend/app/services/gamma_offline_canonical_child.py'
      - 'backend/app/services/gamma_signed_increment_provenance.py'
      - 'backend/app/services/gamma_broker_protection_review.py'
      - 'backend/tests/unit/test_gamma_broker_protection_review.py'
      - 'backend/app/services/gamma_move_runner.py'
      - 'backend/app/services/canonical_strategy_reduction.py'
      - 'backend/app/services/canonical_fill_reconciliation.py'
      - 'backend/app/services/execution_service.py'
      - 'backend/app/services/kite_engine/order_journal.py'
      - 'backend/app/services/simulation/mode.py'
      - 'backend/app/services/simulation/tenant.py'
      - 'backend/app/services/simulation/sim_runtime.py'
      - 'backend/app/services/simulation/ledger.py'
      - 'backend/app/services/simulation/sim_reset_sql_fences.py'
      - 'backend/app/services/db.py'
      - 'backend/app/services/simulation/virtual_exchange.py'
      - 'backend/tests/unit/simulation/test_sim_ledger.py'
      - 'backend/tests/unit/simulation/test_sim_virtual_exchange.py'
      - 'backend/tests/unit/simulation/test_sim_runtime.py'
      - 'backend/app/api/v1/endpoints/sim.py'
      - 'backend/tests/unit/simulation/test_tenancy_mode.py'
      - 'backend/tests/unit/simulation/test_tenancy_api.py'

permissions:
  contents: read

concurrency:
  group: gamma-canonical-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-recovery:
    name: Canonical Gamma lifecycle and fail-closed regression (synthetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Verify test syntax and static release-control manifest
        run: |
          python -m compileall -q backend/tests/services/test_gamma_recovery.py
          python scripts/validate_preproduction_controls.py
      - name: Synthetic Gamma and canonical reduction regression
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
          STERLING_LIVE_EXECUTION: '0'
        run: |
          python -m pytest -q --tb=short \
            tests/services/test_gamma_recovery.py \
            tests/services/test_gamma_fired_child.py \
            tests/services/test_gamma_move_live_audit.py \
            tests/services/test_gamma_move_production.py \
            tests/services/test_canonical_fill_reconciliation.py \
            tests/unit/test_canonical_strategy_reduction.py \
            tests/engines/sterling_kite_engine/test_production_audit.py \
            tests/unit/test_canonical_execution_convergence.py \
            tests/unit/test_canonical_fresh_reduction_proof.py \
            tests/unit/test_gamma_tranche_readiness.py \
            tests/unit/test_gamma_broker_protection_review.py

      - name: Synthetic simulation reset refusal and ordinary reset regression
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
          STERLING_LIVE_EXECUTION: '0'
          PYTHONPATH: '.:tests/unit/simulation'
        run: |
          python -m pytest -q --tb=short \
            tests/unit/simulation/test_tenancy_mode.py \
            tests/unit/simulation/test_tenancy_api.py \
            tests/unit/simulation/test_tenancy_boot.py \
            tests/unit/simulation/test_sim_runtime.py \
            tests/unit/simulation/test_sim_ledger.py \
            tests/unit/simulation/test_sim_virtual_exchange.py

      - name: Isolated Kite login key preflight and mobile login regressions
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
          STERLING_LIVE_EXECUTION: '0'
        run: |
          python -m pytest -q --tb=short \
            tests/test_kite_login_preflight.py \
            tests/test_kite_mobile_login.py

      - name: Synthetic Snapback admission, simulation and journal E2E (offline fake Kite)
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
          DEFAULT_UNDERLYING: NIFTY
        run: |
          python -m pytest -q --tb=short \
            tests/e2e_live/test_admission_dry_run.py \
            tests/e2e_live/test_sim_e2e.py \
            tests/e2e_live/test_trade_journal_e2e.py

name: OpenAlgo Platform Contracts (offline)

on:
  pull_request:
    paths:
      - ".github/workflows/openalgo-platform-contracts.yml"
      - "backend/main.py"
      - "backend/app/api/v1/endpoints/platform_surfaces.py"
      - "backend/app/services/platform_surface_registry.py"
      - "backend/app/services/platform_session_read.py"
      - "backend/tests/unit/test_platform_session_read.py"
      - "backend/tests/unit/test_platform_surface_registry.py"
      - "backend/app/api/v1/endpoints/openalgo_compat.py"

permissions:
  contents: read

concurrency:
  group: openalgo-platform-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    name: Authentication and non-authorizing platform registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with no stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Syntax check
        run: python -m compileall -q backend/app/api/v1/endpoints/platform_surfaces.py backend/app/services/platform_surface_registry.py backend/tests/unit/test_platform_surface_registry.py backend/tests/unit/test_platform_session_read.py
      - name: Check JWT, feature gates, metadata, legacy read adapter and route isolation
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
        run: |
          python -m pytest -q --tb=short tests/unit/test_platform_surface_registry.py tests/unit/test_platform_session_read.py tests/unit/test_openalgo_compat.py tests/services/test_ticker_subscription_ownership.py tests/test_kite_ticker_account_binding.py tests/unit/simulation/test_tenancy_feed.py

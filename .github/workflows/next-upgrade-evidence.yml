name: Next Upgrade Evidence (Source-Only NO-GO)
on:
  push:
    branches:
      - upgrade/evidence-traceability-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile offline validator
        run: python -m py_compile scripts/verify_next_upgrade_evidence.py scripts/tests/test_next_upgrade_evidence.py scripts/tests/test_next_upgrade_hardening_evidence.py
      - name: Run source-only negative tests
        run: python -m unittest discover -s scripts/tests -p 'test_next_upgrade_*.py' -v
      - name: Emit sanitized NO-GO artifact
        run: python scripts/verify_next_upgrade_evidence.py --output /tmp/next-upgrade-no-go.json
      - name: Assert report contains no acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/next-upgrade-no-go.json').read_text())
          assert x['validation']=='PASS'
          assert x['accepted_controls']==0 and x['blocked_controls']==12
          assert x['production_certification']=='NOT_ACHIEVED'
          assert x['production_deployment']=='NO_GO'
          assert x['live_trading']=='NOT_AUTHORIZED'
          assert x['broker_order_routing']=='NOT_AUTHORIZED'
          assert x['product_runtime_reverified'] is False
          assert x['real_environment_evidence_verified'] is False
          print('Source package verified; 12 controls blocked; no authority granted.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: next-upgrade-evidence-source-only-no-go
          path: /tmp/next-upgrade-no-go.json
          if-no-files-found: error
          retention-days: 30

  frontend-workspace-regressions:
    name: Isolated workspace and shell regressions (synthetic policy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies (no app server)
        working-directory: frontend
        run: npm ci --silent
      - name: Run workspace/account/modal unit regressions (mocked APIs)
        working-directory: frontend
        run: npx vitest run src/pages/__tests__/WorkspaceRouter.test.tsx --coverage=false
      - name: Type-check frontend source and tests
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build frontend in isolated CI checkout (not deployed)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build

  backend-governance-regressions:
    name: Disposable DB governance regressions (NO BROKER I/O)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install pinned offline test dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Test policy, ownership, audit and credential boundaries on disposable data
        working-directory: backend
        env:
          ENVIRONMENT: test
          STERLING_LIVE_EXECUTION: "false"
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          LOG_LEVEL: WARNING
        run: python -m pytest tests/test_account_policy.py tests/test_configuration_policy.py tests/test_workspace_access.py tests/test_kite_login_credentials.py -q --tb=short

  browser-responsive-readonly:
    name: Local Chromium responsive QA (mocked API, NO operational I/O)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and local Chromium
        working-directory: frontend
        run: |
          npm ci --silent
          npx playwright install --with-deps chromium
      - name: Browser QA with synthetic read-only transport
        working-directory: frontend
        env:
          CI: "true"
          VITE_API_BASE_URL: ""
        run: npx playwright test -c playwright.next-upgrade.config.ts
      - name: Preserve synthetic browser evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sterling-v2-increment3-synthetic-chromium
          path: frontend/test-results/increment-3/
          if-no-files-found: warn
          retention-days: 14

  increment4-governance-contract:
    name: Increment 4 owner, MFA, device and NO-GO package (source-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source-only governance checker and mutation tests
        run: python -m py_compile scripts/verify_increment4_governance.py scripts/tests/test_next_upgrade_increment4_governance.py
      - name: Fail-closed owner, MFA and device mutation tests
        run: python -m unittest scripts.tests.test_next_upgrade_increment4_governance -v
      - name: Write sanitized blocked-control review receipt
        run: python scripts/verify_increment4_governance.py --output /tmp/sterling-increment4-no-go.json
      - name: Reassert no operational authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/sterling-increment4-no-go.json').read_text())
          assert x['validation']=='PASS'
          assert x['controls_accepted']==0 and x['controls_blocked']==12
          assert x['owners_confirmed']==0 and x['physical_device_sessions']==0
          assert not x['mfa_accepted'] and x['independent_signatures']==0
          assert x['production_certification']=='NOT_ACHIEVED'
          assert x['production_deployment']=='NO_GO'
          assert x['live_trading']=='NOT_AUTHORIZED'
          assert x['broker_order_routing']=='NOT_AUTHORIZED'
          assert x['release_freeze']=='ACTIVE'
          print('Increment 4 source-package gate: NO-GO, 12/12 blocked.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sterling-v2-increment4-source-only-no-go
          path: /tmp/sterling-increment4-no-go.json
          if-no-files-found: error
          retention-days: 30

  increment5-final-source-review:
    name: Increment 5 final 12-control NO-GO governance review (source-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile final nonoperational source validator and negative tests
        run: python -m py_compile scripts/verify_increment5_governance.py scripts/tests/test_next_upgrade_increment5_governance.py
      - name: Execute 12-control final packet mutation guards
        run: python -m unittest scripts.tests.test_next_upgrade_increment5_governance -v
      - name: Emit NO-GO review receipt without credentials or human claims
        run: python scripts/verify_increment5_governance.py --output /tmp/sterling-v2-final-packet-no-go.json
      - name: Refuse control acceptance and operational approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/sterling-v2-final-packet-no-go.json').read_text())
          assert r['validation']=='PASS'
          assert r['controls_accepted']==0 and r['controls_blocked']==12
          assert r['human_owners_confirmed']==r['independent_signatures']==r['independent_receipts_received']==0
          assert r['production_certification']=='NOT ACHIEVED'
          assert r['production_deployment']=='NO-GO'
          assert r['live_trading']==r['broker_order_routing']=='NOT AUTHORIZED'
          assert r['release_freeze']=='ACTIVE'
          assert not r['external_host_or_provider_access_performed']
          print('Final source-only review package verified: 0/12 accepted, 12/12 blocked.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sterling-v2-increment5-final-source-no-go
          path: /tmp/sterling-v2-final-packet-no-go.json
          if-no-files-found: error
          retention-days: 30
  
  increment6-final-policy-quality:
    name: Final governance schema, source fingerprint and NO-GO quality (source-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile final policy-quality guard and mutation tests
        run: python -m py_compile scripts/verify_increment6_closeout.py scripts/tests/test_next_upgrade_increment6_closeout.py
      - name: Validate human-review-only source package and mutation rejection
        run: python -m unittest scripts.tests.test_next_upgrade_increment6_closeout -v
      - name: Generate sanitized local-source SHA-256 integrity inventory (NOT real evidence)
        run: python -m scripts.verify_increment6_closeout --output /tmp/sterling-v2-final-source-quality-no-go.json
      - name: Reassert release freeze and zero accepted controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/sterling-v2-final-source-quality-no-go.json').read_text())
          assert x['validation']=='PASS'
          assert x['classification']=='SOURCE_ONLY_REVIEW_NOT_PRODUCTION_EVIDENCE'
          assert x['controls_accepted']==0 and x['controls_blocked']==12
          assert x['human_owners_confirmed']==x['independent_signatures']==x['real_environment_receipts']==0
          assert x['source_files_verified']==22
          assert x['production_certification']=='NOT ACHIEVED'
          assert x['production_deployment']=='NO-GO'
          assert x['live_trading']==x['broker_order_routing']=='NOT AUTHORIZED'
          assert x['release_freeze']=='ACTIVE'
          print('Source fingerprint and schema validated; no production authority.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sterling-v2-final-governance-source-quality-no-go
          path: /tmp/sterling-v2-final-source-quality-no-go.json
          if-no-files-found: error
          retention-days: 30

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -q --tb=short
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          DEFAULT_UNDERLYING: NIFTY
          LOG_LEVEL: WARNING

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Run Vitest
        working-directory: frontend
        run: npx vitest run --coverage=false
        env:
          VITE_API_BASE_URL: http://localhost:8000

  e2e:
    name: E2E Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [frontend-typecheck]
    strategy:
      fail-fast: false
      matrix:
        # Three spec files — do not shard. Parity is covered by parity-matrix,
        # not by duplicating this job. Artifact names must not contain '/'.
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --silent
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Start backend
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          DEFAULT_UNDERLYING: NIFTY
          LOG_LEVEL: WARNING
        run: |
          set -euo pipefail
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/uvicorn.pid)" 2>/dev/null; then cat /tmp/backend.log; exit 1; fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1
      - name: Install Playwright browser
        working-directory: frontend
        # setup project always launches Desktop Chrome, even when the matrix
        # browser is firefox/webkit. Without chromium the setup job dies with
        # "Executable doesn't exist … chromium_headless_shell".
        run: npx playwright install --with-deps chromium ${{ matrix.project }}
      - name: Run Playwright E2E
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
          CI: "true"
        run: npx playwright test --project=${{ matrix.project }} --reporter=list
      - name: Upload Playwright artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Dump backend log
        if: failure()
        run: cat /tmp/backend.log || true

  orb-options-gate:
    name: ORB Automated Options Safety Gate
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run safety tests
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_live_safety.py
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          LOG_LEVEL: WARNING

  parity-matrix:
    name: Parity Matrix (${{ matrix.parity }})
    runs-on: ubuntu-latest
    needs: [backend-tests]
    strategy:
      fail-fast: false
      matrix:
        parity: [directional, kite]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Run parity tests
        working-directory: backend
        run: python -m pytest tests/test_common_trailing.py -q --disable-warnings -m "${{ matrix.parity }}" --tb=line


  docker-smoke:
    name: Production Docker Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        env:
          STERLING_SECRET_KEY: "ci-encryption-secret-aaaaaaaaaaaaaaaaaaaaaaaa"
          STERLING_JWT_SECRET: "ci-jwt-secret-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          STERLING_ADMIN_USERNAME: "ci-admin"
          STERLING_ADMIN_PASSWORD: "ci-admin-password-not-for-production"
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: docker compose build
      - name: Start production containers
        env:
          STERLING_SECRET_KEY: "ci-encryption-secret-aaaaaaaaaaaaaaaaaaaaaaaa"
          STERLING_JWT_SECRET: "ci-jwt-secret-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          STERLING_ADMIN_USERNAME: "ci-admin"
          STERLING_ADMIN_PASSWORD: "ci-admin-password-not-for-production"
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: |
          set -euo pipefail
          docker compose up -d
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color backend frontend
          exit 1
      - name: Stop production containers
        if: always()
        env:
          STERLING_SECRET_KEY: "ci-encryption-secret-aaaaaaaaaaaaaaaaaaaaaaaa"
          STERLING_JWT_SECRET: "ci-jwt-secret-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          STERLING_ADMIN_USERNAME: "ci-admin"
          STERLING_ADMIN_PASSWORD: "ci-admin-password-not-for-production"
        run: docker compose down -v --remove-orphans

  release-gate:
    name: Sterling Release Gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [backend-tests, frontend-typecheck, frontend-tests, e2e, orb-options-gate, parity-matrix, docker-smoke]
    steps:
      - name: Evaluate All Upstream Jobs
        run: |
          set -euo pipefail
          echo "Evaluating status of all mandatory release jobs..."

          BACKEND="${{ needs.backend-tests.result }}"
          TYPECHECK="${{ needs.frontend-typecheck.result }}"
          FRONTEND_TESTS="${{ needs.frontend-tests.result }}"
          E2E="${{ needs.e2e.result }}"
          SAFETY="${{ needs.orb-options-gate.result }}"
          PARITY="${{ needs.parity-matrix.result }}"
          DOCKER="${{ needs.docker-smoke.result }}"

          echo "backend-tests:      $BACKEND"
          echo "frontend-typecheck: $TYPECHECK"
          echo "frontend-tests:     $FRONTEND_TESTS"
          echo "e2e:                $E2E"
          echo "orb-options-gate:   $SAFETY"
          echo "parity-matrix:       $PARITY"
          echo "docker-smoke:        $DOCKER"

          FAILED=0
          for status in "$BACKEND" "$TYPECHECK" "$FRONTEND_TESTS" "$E2E" "$SAFETY" "$PARITY" "$DOCKER"; do
            if [ "$status" != "success" ]; then
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "::error::Release Gate FAILED. One or more mandatory jobs failed, were cancelled, or were skipped."
            exit 1
          fi

          echo "All mandatory release jobs executed and passed cleanly. Release Gate: SUCCESS."


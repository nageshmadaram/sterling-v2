name: Preproduction source inventory (non-authorizing)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline inventory unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_preproduction_inventory.py'
      - name: Offline governance schema regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_preproduction_controls.py'
      - name: Verify twelve controls remain explicitly unapproved
        run: python scripts/validate_preproduction_controls.py
      - name: Fail closed on new ordinary broker-order bypasses
        run: python scripts/preproduction_inventory.py --output "$RUNNER_TEMP/preproduction-inventory" --strict
      - name: Upload source-only evidence (never a release approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preproduction-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/preproduction-inventory/
          if-no-files-found: warn
          retention-days: 14

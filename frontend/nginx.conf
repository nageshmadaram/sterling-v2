# Sterling frontend - static SPA + reverse proxy to the FastAPI backend.
#
# Loaded as /etc/nginx/conf.d/default.conf, i.e. inside the http {} context.
#
# NOTE ON add_header: nginx does NOT inherit add_header into a block that declares
# its own add_header. Every location below that serves a document therefore repeats
# the full security-header set.

# WebSocket upgrade: only send "Connection: upgrade" when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HSTS only when a TLS terminator in front of us says the client used https.
map $http_x_forwarded_proto $sterling_hsts {
    https   "max-age=31536000";
    default "";
}

# Per-client brute-force guard in front of the backend's own limiter.
limit_req_zone $binary_remote_addr zone=sterling_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Same ceiling as the backend (STERLING_MAX_BODY_BYTES, 8 MiB).
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;

    # Media styles are compiled locally; refresh must pick up a new release.
    location ~ ^/(media/|(?:tv|radio)/.*\.css$) {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ── Compression ────────────────────────────────────────────────────────────
    # The main JS chunk is ~1.3 MB raw / ~370 KB gzip; JSON signal tables compress
    # ~10x. Event streams are never compressed (they must flush per event).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript text/javascript
        application/xml image/svg+xml
        font/ttf font/otf application/vnd.ms-fontobject;

    # ── API proxy ──────────────────────────────────────────────────────────────
    # The backend sets its own security headers, CSP and Cache-Control: no-store;
    # nothing is added here so they are not duplicated.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Login: 10 requests/minute per client address, small burst.
    location = /api/v1/auth/login {
        limit_req zone=sterling_login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4k;
    }

    # Live order/tick WebSocket. Needs HTTP/1.1 + Upgrade; without them the browser
    # socket never opens through nginx and every price falls back to REST polling.
    location /api/v1/stream/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Server-sent events (replay simulation): no buffering, no compression.
    location = /api/v1/simulation/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # Mini App public shell and signed controller requests use backend CSP/auth.
    location ~ ^/tma(?:/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # TV is a separate, untrusted multimedia document. Even direct navigation
    # must receive an opaque-origin sandbox: it must not see Sterling auth,
    # live trading localStorage, cookies or broker API credentials.
    # The IPTV player needs bundled HLS and user-selected HTTPS streams,
    # which are deliberately NOT allowed on the normal trading SPA.
    location = /tv { return 302 /tv/index.html; }
    location = /tv/ { return 302 /tv/index.html; }
    location = /tv/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-downloads allow-presentation; default-src 'none'; script-src 'self' 'unsafe-inline'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src data:; img-src https: data: blob:; media-src https: http: data: blob:; connect-src https: http:; worker-src blob:; frame-src https:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security $sterling_hsts always;
    }

    # Radio is an origin-opaque multimedia app, never a Kite or Simulation
    # execution context. Its CDN resources and remote streams are restricted
    # to this one document, not the trading SPA.
    location = /radio { return 302 /radio/index.html; }
    location = /radio/ { return 302 /radio/index.html; }
    location = /radio/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-downloads allow-presentation allow-popups allow-popups-to-escape-sandbox; default-src 'none'; script-src 'self' 'unsafe-inline'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src data:; img-src https: data: blob:; media-src https: http: data: blob:; connect-src https: http:; worker-src blob:; frame-src https:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security $sterling_hsts always;
    }

    # ── Static assets: content-hashed filenames, safe to cache for a year ──────
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $sterling_hsts always;
    }

    # ── SPA: the document itself must always be revalidated ────────────────────
    # Inline script allowed by hash (the pre-paint theme/font bootstrap in
    # index.html). frontend/src/test/nginxCsp.test.ts fails if index.html's inline
    # script changes without this hash being updated.
    # Google Fonts is the font-picker's CDN (index.html <link>); self-hosting it
    # would let font-src/style-src drop those two origins.
    # connect-src lists the page's own host for ws:/wss: because older Safari does
    # not treat 'self' as covering WebSocket schemes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Qt9cIAaOnvia/+BH/ai80KclZkM6haOeL5xXcF8ZIXE=' 'sha256-p4FoLZoexSomaMuZVZ5ZILGJj2BTuLdZraAQkonFrf8=' https://telegram.org/js/telegram-web-app.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws://$http_host wss://$http_host; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.telegram.org https://telegram.org https://t.me" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $sterling_hsts always;
    }
}

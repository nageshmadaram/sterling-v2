# Phase 10 isolated read-only OFFLINE operator UI proxy.
# Loopback port only. TLS MUST terminate at a separately certified edge.
# This file is NOT the legacy Sterling nginx.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 8k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    location ^~ /api/ { return 404; }
    # FastAPI isolated app performs signed JWT, RBAC, and admin MFA
    # on every offline-validation URL, including GET.
    location ^~ /api/v1/offline-validation/ {
        proxy_pass http://offline_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Sterling-Offline-MFA $http_x_sterling_offline_mfa;
        proxy_set_header X-User-Id "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location = /api/v1/offline-security/mfa/verify {
        limit_except POST { deny all; }
        proxy_pass http://offline_backend:8000;
        proxy_set_header Authorization $http_authorization;
    }
    location = /api/v1/auth/login {
        limit_except POST { deny all; }
        proxy_pass http://offline_backend:8000;
    }
    location = /api/v1/auth/refresh {
        limit_except POST { deny all; }
        proxy_pass http://offline_backend:8000;
    }
    location = /api/v1/auth/logout {
        limit_except POST { deny all; }
        proxy_pass http://offline_backend:8000;
        proxy_set_header Authorization $http_authorization;
    }
    location = /api/v1/auth/me {
        limit_except GET { deny all; }
        proxy_pass http://offline_backend:8000;
        proxy_set_header Authorization $http_authorization;
    }
    location = /healthz { proxy_pass http://offline_backend:8000; }
    location = /readyz { proxy_pass http://offline_backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
}

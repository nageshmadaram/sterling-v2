[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    live_client: run the test's broker double as a LIVE client (default is paper)
    yahoo_unit: exercises app.services.yahoo_candles directly (HTTP stubbed by the test)
    directional: directional-engine parity and behavior tests
    kite: Kite-engine parity and behavior tests
